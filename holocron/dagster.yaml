storage:
  postgres:
    postgres_url:
      env: DAGSTER_POSTGRES_URL

run_coordinator:
  module: dagster.core.run_coordinator
  class: DefaultRunCoordinator

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Assets declare pools (provider_<provider>, market_release); each runs one at a time.
concurrency:
  pools:
    default_limit: 1

telemetry:
  enabled: false
