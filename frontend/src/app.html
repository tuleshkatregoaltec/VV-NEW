<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="index, follow" />
		<meta name="format-detection" content="telephone=no" />
		<script>
			;(() => {
				try {
					const stored = JSON.parse(localStorage.getItem('vitevue-preferences') || '{}')
					const preference = ['light', 'dark', 'system'].includes(stored.theme)
						? stored.theme
						: 'system'
					const resolved =
						preference === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: preference
					document.documentElement.dataset.theme = resolved
					document.documentElement.dataset.themePreference = preference
					document.documentElement.style.colorScheme = resolved
				} catch {
					const resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light'
					document.documentElement.dataset.theme = resolved
					document.documentElement.dataset.themePreference = 'system'
					document.documentElement.style.colorScheme = resolved
				}
			})()
		</script>

		<!-- Favicons -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Open Graph / Social Media -->
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/images/vitevue-og-image-1200x630.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:image"
			content="%sveltekit.assets%/images/vitevue-twitter-card-1200x600.png"
		/>

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
