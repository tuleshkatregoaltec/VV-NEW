[project]
name = "analytics-backend"
version = "0.1.0"
description = "Backend for analytics platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.120.1",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "ruff>=0.14.2",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.38.0",
    "requests>=2.32.5",
    "tqdm>=4.66.0",
    "redis>=7.0.1",
    "workos>=5.33.0",
    "pydantic-settings>=2.12.0",
    "starlette>=0.49.1",
    "itsdangerous>=2.2.0",
    "honeybadger>=1.1",
    "asyncpg>=0.31.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "polars>=1.35.2",
    "alembic>=1.14.0",
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "openrouter>=0.1.1",
    "openai>=2.13.0",
    "fastmcp>=2.14.1",
    "aiofiles>=25.1.0",
    "pyjwt>=2.10.1",
    "posthog>=7.5.1",
    "aioboto3>=13.3.0",
    "supabase-auth>=2.27.2",
    "gunicorn>=23.0.0",
    "stripe>=14.2.0",
    "pydantic-ai>=1.38.0",
    "logfire[fastapi]>=4.19.0",
    "clickhouse-connect>=0.10.0",
    "clickhouse-driver>=0.2.10",
    "pillow>=11.0.0",
    "jsonschema==4.25.1",
    "langsmith[otel]>=0.14.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "greenlet>=3.2.4",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]
